<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Synergy Deals Limited</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0B2545', dark: '#071A33' },
            accent: { DEFAULT: '#FF6B35', soft: '#FF8C5A' },
            teal: { DEFAULT: '#06B6D4' },
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center px-4">

  <main class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="../assets/logo.png" alt="Synergy Deals Limited logo" class="h-14 w-auto object-contain mx-auto rounded" />
      <h1 class="font-heading font-bold text-xl text-primary mt-4">Admin Dashboard</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to manage products</p>
    </div>

    <form id="login-form" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8 space-y-5">
      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" class="form-input" placeholder="you@synergydealsltd.co.ke" />
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" class="form-input" placeholder="••••••••" />
      </div>

      <div id="form-message" class="hidden text-sm font-medium rounded-lg px-3 py-2"></div>

      <button type="submit" id="login-btn" class="btn-cta w-full justify-center">
        <span id="login-btn-text">Sign In</span>
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a href="../index.html" class="hover:text-teal transition-colors">&larr; Back to main site</a>
    </p>
  </main>

  <script src="../js/api-config.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
